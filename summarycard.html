<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Summary Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none;
            }
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f5; /* zinc-100 */
        }
        .summary-card {
            background-color: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px_6px -1px rgb(0 0 0 / 0.1), 0 2px_4px -2px rgb(0 0 0 / 0.1);
            margin: 2rem auto;
            max-width: 8.5in; /* Standard letter paper width */
        }
        .summary-header {
            text-align: center;
            border-bottom: 2px solid #e4e4e7; /* zinc-200 */
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .summary-section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #3f3f46; /* zinc-700 */
            border-bottom: 1px solid #e4e4e7;
            padding-bottom: 0.5rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }
        .summary-subsection-title {
            font-size: 1rem;
            font-weight: 600;
            color: #52525b; /* zinc-600 */
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .summary-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #3f3f46;
        }
        .summary-content ul {
            list-style-position: inside;
            padding-left: 0.5rem;
        }
        .summary-content .data-pair {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
        }
        .summary-content .data-pair .key {
            font-weight: 500;
            color: #71717a; /* zinc-500 */
        }
        .summary-content .data-pair .value {
            text-align: right;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            border: 1px solid transparent;
        }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-secondary { background-color: #e4e4e7; color: #3f3f46; }
        .btn-secondary:hover { background-color: #d4d4d8; }
    </style>
    <link rel="stylesheet" href="assets/summary-details.css">
</head>
<body>

    <div class="max-w-4xl mx-auto p-4 no-print">
        <div class="flex flex-wrap gap-3 justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Patient Summary</h1>
            <div class="flex flex-wrap gap-2">
                <button id="backToDashboardButton" class="btn btn-secondary">Back to Dashboard</button>
                <a id="clinicalSummaryLink" class="btn btn-secondary" hidden>Clinical Summary</a>
                <button id="printButton" disabled class="btn btn-primary">Print Summary</button>
            </div>
        </div>
    </div>

    <div id="print-area">
        <div class="summary-card" id="summaryCardContainer">
            <!-- Content will be loaded here by JavaScript -->
            <div class="text-center text-gray-500">Loading patient data...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDocFromServer } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        import { renderPatientHeader, renderClinicalSections, renderInvestigationAndTreatmentSections } from "./assets/clinical-summary.js";

        // --- Firebase and Global Config ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDMIZubC87_z2tCnURoqQIJjCWPPdWFdnk",
            authDomain: "pcms-e1162.firebaseapp.com",
            projectId: "pcms-e1162",
            storageBucket: "pcms-e1162.firebasestorage.app",
            messagingSenderId: "383068543378",
            appId: "1:383068543378:web:00c7d2bf95f9ded63a494b",
            measurementId: "G-4C1P3GB6PP"
        };
        
        let app, db, auth, doctorUserId, fromDashboard, patientId, authGeneration = 0;

        // --- DOM Elements ---
        const summaryCardContainer = document.getElementById('summaryCardContainer');
        const backToDashboardButton = document.getElementById('backToDashboardButton');
        const printButton = document.getElementById('printButton');

        // --- Helper Functions ---
        const isEmpty = (arr) => !Array.isArray(arr) || arr.length === 0;
        const toSentenceCase = (str) => str.charAt(0).toUpperCase() + str.slice(1);

        /**
         * Generates a narrative summary from the patient record.
         * This function creates the main, high-level summary.
         */
        function generateSmartSummary(record) {
            if (!record || !record.history) return "Not enough information to generate a summary.";

            const { history, examination, treatment } = record;
            const { hpi = '', pastMedical = [] } = history;
            const demographics = history.demographics || {}, chiefComplaint = history.chiefComplaint || {};
            const vitals = examination?.vitals || {}, cardiovascularExam = examination?.cardiovascularExam || {};
            const { diagnosis: finalDiagnosis, pharmacological = [] } = treatment || {};
            
            const dob = new Date(demographics.dob);
            const age = demographics.dob && Number.isFinite(dob.getTime()) && dob <= new Date() ? new Date(new Date() - dob).getUTCFullYear() - 1970 : null;
            const gender = demographics.gender || 'patient';

            let summary = age === null ? `This is a ${String(gender).toLowerCase()}` : `This is a ${age}-year-old ${String(gender).toLowerCase()}`;
            if (demographics.name) summary += `, ${demographics.name},`;
            summary += ` who presented with a chief complaint of "${chiefComplaint.complaint || 'unspecified issue'}" for a duration of ${chiefComplaint.duration || 'an unknown period'}.`;
            
            if (hpi) summary += `\n\nThe history of the presenting illness is as follows: ${hpi}`;

            if (!isEmpty(pastMedical)) {
                const diseases = pastMedical.filter(d => d?.disease).map(d => `${d.disease} (${d.control || 'status unknown'})`).join(', ');
                if (diseases) summary += `\n\nRecorded past medical history: ${diseases}.`;
            }

            if (vitals.bp || vitals.hr) {
                summary += `\n\nOn examination, vital signs were notable for a blood pressure of ${vitals.bp || 'N/A'} mmHg and a heart rate of ${vitals.hr || 'N/A'} bpm.`;
            }
            
            if (cardiovascularExam?.auscultation?.murmurPresent === 'Yes') {
                const murmur = cardiovascularExam.auscultation.murmur || {};
                summary += ` A ${murmur.timing || ''} murmur of grade ${String(murmur.loudness || '').split(' ')[0] || ''} was noted at the ${murmur.location || 'unspecified area'}.`;
            }

            if (finalDiagnosis) summary += `\n\nThe recorded final diagnosis is ${finalDiagnosis}.`;

            if (!isEmpty(pharmacological)) {
                const drugs = pharmacological.filter(d => d?.name).map(d => [d.name,d.dose,d.frequency].filter(Boolean).join(' ')).join(', ');
                if (drugs) summary += ` Recorded prescriptions: ${drugs}.`;
            }

            return summary;
        }
        
        /**
         * Renders the full patient summary card.
         */
        function safeSummaryValue(value) {
            if (typeof value === 'string') return value.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            if (Array.isArray(value)) return value.map(safeSummaryValue);
            if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([k,v]) => [k,safeSummaryValue(v)]));
            return value;
        }
        function renderSummaryCard(input) {
            const originalHistory = input.history && typeof input.history === 'object' && !Array.isArray(input.history) ? input.history : {};
            const d = originalHistory.demographics || {};
            const record = safeSummaryValue({
                history: {...originalHistory, demographics: {...d, name: d.name ?? input.name, dob: d.dob ?? input.dateOfBirth, gender: d.gender ?? input.gender}, hpi: originalHistory.hpi ?? (typeof input.history === 'string' ? input.history : '')},
                examination: input.examination,
                treatment: input.treatment && typeof input.treatment === 'object' ? input.treatment : {}
            });
            const smartSummaryText = generateSmartSummary(record);
            summaryCardContainer.innerHTML = renderPatientHeader(input) +
                '<div class="summary-section"><h2 class="summary-section-title">Smart Summary</h2><p class="summary-content whitespace-pre-wrap bg-blue-50 p-4 rounded-lg border border-blue-200">'+smartSummaryText+'</p></div>' +
                renderClinicalSections(input) + renderInvestigationAndTreatmentSections(input);
            printButton.disabled = false;
            const link = document.getElementById('clinicalSummaryLink');
            link.href = 'clinical-summary.html?' + new URLSearchParams({from:fromDashboard,patientId});
            link.hidden = false;
        }

        /**
         * Fetches the patient record from Firestore.
         */
        async function fetchPatientRecord(uid, generation) {
            if (!doctorUserId || !patientId) {
                summaryCardContainer.innerHTML = `<div class="text-center text-red-600 font-semibold">Error: Missing Doctor or Patient ID. Cannot load data.</div>`;
                return;
            }

            const patientDocRef = doc(db, `artifacts/${appId}/doctors/${uid}/patients`, patientId);
            try {
                const docSnap = await getDocFromServer(patientDocRef);
                if (generation !== authGeneration || auth.currentUser?.uid !== uid) return;
                if (docSnap.exists()) {
                    const patientRecord = docSnap.data();
                    renderSummaryCard(patientRecord);
                } else {
                    summaryCardContainer.innerHTML = `<div class="text-center text-red-600 font-semibold">Error: Patient record not found.</div>`;
                }
            } catch (error) {
                if (generation !== authGeneration) return;
                console.error("Error loading patient from Firestore:", error);
                summaryCardContainer.innerHTML = `<div class="text-center text-red-600 font-semibold">Error loading data. Please check the console.</div>`;
            }
        }

        /**
         * Initializes the page, gets URL params, and sets up Firebase.
         */
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            fromDashboard = urlParams.get('from');
            patientId = urlParams.get('patientId');

            if (fromDashboard !== 'cardiology-dashboard.html' || !patientId || patientId.includes('/')) {
                summaryCardContainer.innerHTML = `<div class="text-center text-red-600 font-semibold">Error: Navigation context lost. Please return to the dashboard.</div>`;
                return;
            }

            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                onAuthStateChanged(auth, async (user) => {
                    const generation = ++authGeneration;
                    summaryCardContainer.textContent = 'Verifying patient access…';
                    printButton.disabled = true;
                    document.getElementById('clinicalSummaryLink').hidden = true;
                    if (user) {
                        doctorUserId = user.uid;
                        try {
                            const snap = await getDocFromServer(doc(db, `artifacts/${appId}/public/data/doctors`, user.uid));
                            if (generation !== authGeneration || auth.currentUser?.uid !== user.uid) return;
                            const doctor = snap.exists() ? snap.data() : null;
                            if (!doctor || doctor.deactivated || doctor.role !== 'doctor' || doctor.speciality !== 'Cardiology') { window.location.replace('index.html'); return; }
                            await fetchPatientRecord(user.uid, generation);
                        } catch (_) { if (generation === authGeneration) summaryCardContainer.textContent = 'Unable to verify patient access. Please retry.'; }
                    } else {
                        window.location.href = 'index.html';
                    }
                });
            } catch (e) {
                console.error("Firebase Init Error", e);
                summaryCardContainer.innerHTML = `<div class="text-center text-red-600 font-semibold">Error initializing the application.</div>`;
            }

            backToDashboardButton.addEventListener('click', () => {
                window.location.href = fromDashboard;
            });

            printButton.addEventListener('click', () => {
                if (!printButton.disabled && auth?.currentUser?.uid === doctorUserId) window.print();
            });
        });

    </script>
</body>
</html>
