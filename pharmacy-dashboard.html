<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to right bottom, #f0fdf4, #d1fae5); /* Softer green/teal gradient */
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h2 {
            font-size: 2.25rem; /* text-4xl */
            font-weight: 700; /* font-bold */
            color: #1f2937; /* text-gray-800 */
        }
        .button {
            background: linear-gradient(to right, #22c55e, #10b981); /* Green gradient */
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .button.secondary {
            background: #cbd5e1; /* gray-300 */
            color: #4b5563; /* gray-700 */
        }
        .button.secondary:hover {
            background: #94a3b8; /* gray-400 */
        }
        /* Message Box */
        .message-box {
            display: none;
            background-color: #fefcbf; /* Light yellow */
            border: 1px solid #fde68a; /* Yellow border */
            color: #92400e; /* Dark yellow text */
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            text-align: center;
        }
        .message-box.error {
            background-color: #fef2f2; /* Light red */
            border-color: #fecaca; /* Red border */
            color: #991b1b; /* Dark red text */
            margin-top: 1rem; /* Consistent spacing */
            display: block; /* Ensure it's visible by default for errors in this context */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 class="text-4xl font-bold text-gray-800">Pharmacy Dashboard</h2>
            <button id="logoutButton" class="button secondary">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 001 1h10a1 1 0 001-1V4a1 1 0 00-1-1H3zm2 5a1 1 0 011-1h6a1 1 0 110 2H6a1 1 0 01-1-1zm0 4a1 1 0 011-1h6a1 1 0 110 2H6a1 1 0 01-1-1z" clip-rule="evenodd" />
                </svg>
                Logout
            </button>
        </div>

        <p class="text-xl font-semibold text-gray-700 mb-6" id="pharmacyGreeting">Welcome, <span id="pharmacyBusinessName" class="font-bold text-green-700"></span>!</p>

        <div id="messageBox" class="message-box"></div>

        <div class="main-content mt-8 p-6 bg-gray-50 rounded-lg shadow-inner">
            <h3 class="text-2xl font-semibold text-gray-800 mb-4">Pending Prescriptions</h3>
            <p class="text-gray-600">This section will display prescription requests from doctors.</p>
            <!-- Future content like prescription list, search, etc. will go here -->
        </div>

        <div class="main-content mt-8 p-6 bg-gray-50 rounded-lg shadow-inner">
            <h3 class="text-2xl font-semibold text-gray-800 mb-4">Inventory Management</h3>
            <p class="text-gray-600">Manage your drug inventory here.</p>
            <!-- Future content like inventory list, update forms will go here -->
        </div>
    </div>

    <script type="module">
        // Firebase imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables provided by the Canvas environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        // ==================================================================================================
        // IMPORTANT: If running this HTML file directly from your local file system (e.g., C:/),
        //            you MUST replace the object below with your actual Firebase project config.
        //            You can find this in your Firebase console under Project settings -> Your apps.
        // ==================================================================================================
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDMIZubC87_z2tCnURoqQIJjCWPPdWFdnk",
            authDomain: "pcms-e1162.firebaseapp.com",
            projectId: "pcms-e1162",
            storageBucket: "pcms-e1162.firebasestorage.app",
            messagingSenderId: "383068543378",
            appId: "1:383068543378:web:00c7d2bf95f9ded63a494b",
            measurementId: "G-4C1P3GB6PP"
        }; 
        
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app;
        let db;
        let auth;
        let pharmacyUserId = null; // This will store the UID of the logged-in pharmacy user

        // DOM Elements
        const logoutButton = document.getElementById('logoutButton');
        const pharmacyBusinessNameSpan = document.getElementById('pharmacyBusinessName');
        const messageBox = document.getElementById('messageBox');

        /**
         * Displays a message in the message box.
         * @param {string} message - The message to display.
         * @param {boolean} isError - True if it's an error message, false otherwise.
         */
        function showMessage(message, isError) {
            messageBox.textContent = message;
            // Always show error messages
            messageBox.style.display = 'block'; 
            if (isError) {
                messageBox.classList.remove('bg-fefcbf', 'border-fde68a', 'text-92400e');
                messageBox.classList.add('error');
            } else {
                messageBox.classList.remove('error');
                messageBox.classList.add('bg-fefcbf', 'border-fde68a', 'text-92400e');
            }
            // Clear successful messages after 5 seconds, keep errors visible until manually dismissed or navigation
            if (!isError) {
                setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 5000); 
            }
        }

        /**
         * Handles the logout process.
         */
        async function handleLogout() {
            try {
                if (auth && auth.currentUser) {
                    await signOut(auth);
                    console.log("Pharmacy user logged out successfully.");
                    window.location.href = 'index.html'; 
                } else {
                    console.warn("No active user to log out or auth object not initialized.");
                    window.location.href = 'index.html'; 
                }
            } catch (error) {
                console.error("Error during logout:", error);
                showMessage("Failed to log out. Please try again.", true);
            }
        }

        /**
         * Redirects to the login page with an optional error message.
         * @param {string} message - The message to display.
         */
        function redirectToLoginWithError(message) {
            // Set a flag in session storage before redirecting
            sessionStorage.setItem('loginErrorMessage', message);
            window.location.href = 'index.html';
        }

        /**
         * Initializes Firebase and sets up authentication listener.
         */
        async function initializeFirebase() {
            try {
                if (!app) {
                    app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);
                }

                if (initialAuthToken) {
                    try { await signInWithCustomToken(auth, initialAuthToken); } catch (e) { console.warn("Custom token sign-in failed or expired:", e.message); }
                }

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        pharmacyUserId = user.uid;

                        // Fetch pharmacy's details from Firestore
                        const pharmacyDocRef = doc(db, `artifacts/${appId}/public/data/pharmacies`, user.uid);
                        try {
                            const pharmacyDocSnap = await getDoc(pharmacyDocRef);

                            if (pharmacyDocSnap.exists()) {
                                const pharmacyData = pharmacyDocSnap.data();
                                // Crucial check: Ensure the role explicitly matches 'pharmacy'
                                if (pharmacyData.deactivated) {
                                    await signOut(auth);
                                    redirectToLoginWithError("Your account is deactivated. Please contact support.");
                                    return;
                                } else if (pharmacyData.role === 'pharmacy') { 
                                    pharmacyBusinessNameSpan.textContent = pharmacyData.businessName || 'Pharmacy User';
                                    console.log("Pharmacy Dashboard: User authenticated and data loaded.");
                                    // Clear any previous error messages if successfully loaded
                                    messageBox.style.display = 'none'; 
                                } else {
                                    // User is authenticated but not the expected 'pharmacy' role, redirect
                                    await signOut(auth);
                                    redirectToLoginWithError("Access denied. Please log in with a Pharmacy account.");
                                    return;
                                }
                            } else {
                                // User document not found in pharmacies collection, redirect
                                await signOut(auth);
                                redirectToLoginWithError("Pharmacy account record not found. Please contact support.");
                                return;
                            }
                        } catch (firestoreError) {
                            console.error("Error fetching pharmacy user document:", firestoreError);
                            await signOut(auth); // Sign out the user if there's a Firestore error
                            redirectToLoginWithError("Error loading account data. Please try again or contact support. (Details: " + firestoreError.message + ")");
                            return;
                        }
                    } else {
                        pharmacyUserId = null;
                        console.log("Pharmacy Dashboard: User signed out or no user. Redirecting to login.");
                        redirectToLoginWithError("Please log in to access the Pharmacy Dashboard.");
                        return;
                    }
                });

            } catch (error) {
                console.error("Error initializing Firebase for Pharmacy Dashboard:", error);
                redirectToLoginWithError("Failed to initialize app. Please try again. (Details: " + error.message + ")");
            }
        }

        // Event Listeners
        logoutButton.addEventListener('click', handleLogout);

        // Initialize Firebase when the window loads
        window.onload = initializeFirebase;
    </script>
</body>
</html>
