<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#20b2aa">
    <meta name="view-transition" content="same-origin">
    <title>PSMS - Login</title>
    <link rel="icon" type="image/svg+xml" href="psms-logo.svg">
    <link rel="preload" as="image" href="psms-logo.svg">
    <style>
        :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1e293b; }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: linear-gradient(145deg, #87ceeb, #20b2aa); }
        button, input { font: inherit; }
        .card { width: min(100%, 420px); padding: 36px; background: #fff; border-radius: 24px; box-shadow: 0 16px 48px rgba(15, 73, 82, .17); }
        .brand { text-align: center; margin-bottom: 30px; }
        .brand-mark { width: 76px; height: 76px; display: grid; place-items: center; margin: 0 auto 13px; border-radius: 22px; filter: drop-shadow(0 7px 13px rgba(14, 88, 98, .22)); }
        .brand-mark img { display: block; width: 100%; height: 100%; }
        .brand-name { color: #143b56; font-size: 29px; letter-spacing: .085em; font-weight: 800; line-height: 1.15; margin: 0; }
        .brand-subtitle { color: #64748b; font-size: 12px; margin: 6px 0 0; }
        h1 { font-size: 23px; margin: 27px 0 4px; letter-spacing: -.025em; }
        .subtitle { color: #64748b; margin: 0; font-size: 14px; line-height: 1.5; }
        form { display: grid; gap: 16px; }
        label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 7px; }
        .input-group { position: relative; }
        .input-group svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: #94a3b8; pointer-events: none; }
        input { width: 100%; padding: 13px 13px 13px 43px; min-height: 50px; color: #1e293b; background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; transition: border-color .2s, box-shadow .2s; font-size: 16px; }
        input:focus { border-color: #1aa69c; box-shadow: 0 0 0 3px rgba(32,178,170,.15); }
        input::placeholder { color: #94a3b8; }
        input:disabled { background: #f8fafc; }
        .text-button { border: 0; background: transparent; color: #147c80; cursor: pointer; font-size: 13px; font-weight: 600; justify-self: end; padding: 4px 0; }
        .text-button:hover:not(:disabled) { text-decoration: underline; }
        .text-button:disabled { opacity: .5; cursor: not-allowed; }
        .login-button { display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; min-height: 50px; background: linear-gradient(110deg,#329dbb,#159e96); color: #fff; padding: 13px; border-radius: 11px; font-weight: 700; cursor: pointer; border: none; transition: filter .2s, transform .2s, opacity .2s; }
        .login-button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
        .login-button:focus-visible, .text-button:focus-visible { outline: 3px solid #0d9488; outline-offset: 3px; }
        .login-button:disabled { opacity: .72; cursor: wait; transform: none; }
        .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .75s linear infinite; flex: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message-box { padding: 12px 14px; border: 1px solid #a7f3d0; background: #ecfdf5; color: #065f46; border-radius: 10px; font-size: 13px; line-height: 1.5; }
        .message-box.error { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
        .retry-button { justify-self: center; }
        #authStartupOverlay { position: fixed; inset: 0; z-index: 10; background: linear-gradient(145deg,#87ceeb,#20b2aa); display: grid; place-items: center; padding: 24px; }
        .startup-card { width: min(100%, 360px); padding: 30px; background: #fff; border-radius: 20px; text-align: center; box-shadow: 0 12px 44px rgba(15,73,82,.14); }
        .startup-card .brand-mark { margin-bottom: 12px; }
        .startup-card .spinner { width: 30px; height: 30px; margin: 22px auto 16px; border: 3px solid #d9f2f1; border-top-color: #159e96; }
        .startup-title { margin: 0 0 8px; font-weight: 700; }
        .startup-description { color: #64748b; font-size: 13px; line-height: 1.55; margin: 0; }
        @media (max-width: 480px) { body { padding: 16px; } .card { padding: 28px 24px; border-radius: 20px; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } .spinner { animation-duration: 1.8s; } }
    </style>
</head>
<body>
    <div id="authStartupOverlay" role="status" aria-live="polite" aria-label="Loading PSMS">
        <div class="startup-card">
            <div class="brand-mark" aria-hidden="true"><img src="psms-logo.svg" width="76" height="76" alt=""></div>
            <p class="brand-name">PSMS</p>
            <div class="spinner" aria-hidden="true"></div>
            <p id="startupStatus" class="startup-title">Checking your session...</p>
            <p class="startup-description">Connecting securely. This may take a little longer on a slow connection.</p>
        </div>
    </div>
    <main class="card" id="loginCard" inert>
        <header class="brand">
            <div class="brand-mark" aria-hidden="true"><img src="psms-logo.svg" width="76" height="76" alt=""></div>
            <p class="brand-name">PSMS</p>
            <p class="brand-subtitle">Private Sector Management System</p>
            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to access your dashboard.</p>
        </header>
        <form id="loginForm">
            <div>
                <label for="username">Email</label>
                <div class="input-group">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                    <input type="email" id="username" name="email" placeholder="Enter your email" autocomplete="username" autocapitalize="none" spellcheck="false" required disabled>
                </div>
            </div>
            <div>
                <label for="password">Password</label>
                <div class="input-group">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required disabled>
                </div>
            </div>
            <button type="button" id="forgotPasswordButton" class="text-button" disabled>Forgot password?</button>
            <button id="loginButton" type="submit" class="login-button" disabled>
                <span id="loginSpinner" class="spinner" aria-hidden="true" hidden></span>
                <span id="loginButtonText">Log In</span>
            </button>
            <div id="messageBox" class="message-box" role="status" aria-live="polite" hidden></div>
            <button type="button" id="retryButton" class="text-button retry-button" hidden>Retry connection</button>
        </form>
    </main>
    <noscript><style>#authStartupOverlay { display: none; }</style><p>JavaScript must be enabled to sign in.</p></noscript>
    <script>
    (() => {
        'use strict';
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const roleMappings = {
            // Doctors will now be redirected based on their specialty from doctorSpecialityDashboards map
            'doctor': { collection: 'doctors' }, 
            'pharmacy': { collection: 'pharmacies', dashboard: 'pharmacy-dashboard.html' },
            'radiology_clinic': { collection: 'radiology_clinics', dashboard: 'radiology-clinic-dashboard.html' },
            'lab': { collection: 'labs', dashboard: 'laboratory-dashboard.html' },
            'nurse_clinic': { collection: 'nurse_clinics', dashboard: 'nurse-clinic-dashboard.html' },
            'neurophysiology_clinic': { collection: 'neurophysiology_clinics', dashboard: 'neurophysiology-clinic-dashboard.html' },
            'optometry_clinic': { collection: 'optometry_clinics', dashboard: 'optometry-clinic-dashboard.html' },
            'ent_nurse_clinic': { collection: 'ent_nurse_clinics', dashboard: 'ent-nurse-clinic-dashboard.html' },
            'midwife_clinic': { collection: 'midwife_clinics', dashboard: 'midwife-clinic-dashboard.html' },
            'cast_room_nurse_clinic': { collection: 'cast_room_nurse_clinics', dashboard: 'cast-room-nurse-clinic-dashboard.html' },
            'echocardiography_clinic': { collection: 'echocardiography_clinics', dashboard: 'echocardiography-clinic-dashboard.html' },
            'audiometry_clinic': { collection: 'audiometry_clinics', dashboard: 'audiometry-clinic-dashboard.html' },
            'admin': { collection: null, dashboard: 'admin-dashboard.html' } // Admin handled separately, no public data collection
        };

        // Mapping for doctor specialities to their specific dashboards
        const doctorSpecialityDashboards = {
            'General Practice': 'general-practice-dashboard.html',
            'Cardiology': 'cardiology-dashboard.html',
            'Pediatrics': 'pediatrics-dashboard.html',
            'Dermatology': 'dermatology-dashboard.html',
            'Orthopedics': 'orthopedics-dashboard.html',
            'Neurology': 'neurology-dashboard.html',
            'Oncology': 'oncology-dashboard.html',
            'Gastroenterology': 'gastroenterology-dashboard.html',
            'Ophthalmology': 'ophthalmology-dashboard.html',
            'ENT': 'ent-dashboard.html', 
            'Gynecology': 'gynecology-dashboard.html',
            'Urology': 'urology-dashboard.html',
            'Psychiatry': 'psychiatry-dashboard.html',
            'General Surgery': 'general-surgery-dashboard.html',
            'Plastic Surgery': 'plastic-surgery-dashboard.html',
            'Neurosurgery': 'neurosurgery-dashboard.html',
            'Thoracic Surgery': 'thoracic-surgery-dashboard.html',
            'Vascular Surgery': 'vascular-surgery-dashboard.html',
            'Cardiothoracic Surgery': 'cardiothoracic-surgery-dashboard.html', 
            'Critical Care': 'critical-care-dashboard.html', 
            'Emergency Medicine': 'emergency-medicine-dashboard.html', 
            'Intensive Care Medicine': 'intensive-care-medicine-dashboard.html' 
        };

        const $ = id => document.getElementById(id);
        const overlay = $('authStartupOverlay');
        const loginCard = $('loginCard');
        const form = $('loginForm');
        const usernameInput = $('username');
        const passwordInput = $('password');
        const loginButton = $('loginButton');
        const buttonText = $('loginButtonText');
        const spinner = $('loginSpinner');
        const messageBox = $('messageBox');
        const forgotButton = $('forgotPasswordButton');
        const retryButton = $('retryButton');
        let authApi, firestoreApi, auth, db;
        let ready = false;
        let busy = false;
        let navigating = false;

        function setBusy(value, label = 'Log In') {
            busy = value;
            loginButton.disabled = !ready || value;
            usernameInput.disabled = !ready || value;
            passwordInput.disabled = !ready || value;
            forgotButton.disabled = !ready || value;
            spinner.hidden = !value;
            buttonText.textContent = label;
            form.setAttribute('aria-busy', String(value));
        }

        function showMessage(message, isError = true) {
            messageBox.textContent = message;
            messageBox.classList.toggle('error', isError);
            messageBox.hidden = !message;
        }

        function timeout(promise, ms = 20000) {
            let timer;
            return Promise.race([
                promise,
                new Promise((_, reject) => {
                    timer = setTimeout(() => reject(Object.assign(new Error('Connection timed out'), { code: 'connection-timeout' })), ms);
                })
            ]).finally(() => clearTimeout(timer));
        }

        function storedLoginError() {
            try {
                const message = sessionStorage.getItem('loginErrorMessage');
                sessionStorage.removeItem('loginErrorMessage');
                return message;
            } catch (_) {
                return null;
            }
        }

        function revealForm() {
            overlay.hidden = true;
            loginCard.inert = false;
            setBusy(false);
        }

        const accountError = (code, message) => Object.assign(new Error(message), { code });
        const profileError = () => accountError('profile-unavailable', 'Could not verify your account. Check your internet connection and try again.');
        function friendlyError(error) {
            switch (error?.code) {
                case 'auth/invalid-credential':
                case 'auth/user-not-found':
                case 'auth/wrong-password': return 'Invalid email or password.';
                case 'auth/invalid-email': return 'Please enter a valid email address.';
                case 'auth/user-disabled':
                case 'account-deactivated': return 'Your account is deactivated. Please contact support.';
                case 'account-unauthorized': return 'Account not found or unauthorized. Please contact support.';
                case 'auth/too-many-requests': return 'Too many attempts. Please try again later.';
                case 'auth/network-request-failed':
                case 'connection-timeout':
                case 'profile-unavailable': return 'Could not connect or verify your account. Check your internet connection and try again.';
                case 'auth/user-token-expired':
                case 'auth/invalid-user-token': return 'Your session has expired. Please log in again.';
                case 'account-changed': return 'Your session changed. Please log in again.';
                default: return 'Unable to log in. Please try again.';
            }
        }
        function mustSignOut(error) {
            return ['account-deactivated', 'account-unauthorized', 'auth/user-disabled', 'auth/user-token-expired', 'auth/invalid-user-token'].includes(error?.code);
        }

        // Always read the account profile from the server, not from a cached role.
        async function readProfile(user, role, mapping) {
            const ref = firestoreApi.doc(db, `artifacts/${appId}/public/data/${mapping.collection}`, user.uid);
            try {
                const snap = await firestoreApi.getDocFromServer(ref);
                return { role, mapping, data: snap.exists() ? snap.data() : null };
            } catch (error) {
                return { role, mapping, error };
            }
        }
        function profileDestination(result) {
            if (result.error) {
                // Rules may restrict access to collections belonging to other roles.
                if (result.error.code === 'permission-denied') return null;
                throw profileError();
            }
            if (!result.data) return null;
            if (result.data.deactivated) {
                throw accountError('account-deactivated', 'Account deactivated');
            }
            if (result.data.role !== result.role) return null;
            if (result.role === 'doctor') {
                return Object.hasOwn(doctorSpecialityDashboards, result.data.speciality)
                    ? doctorSpecialityDashboards[result.data.speciality]
                    : 'doctor-dashboard.html';
            }
            return result.mapping.dashboard;
        }

        async function resolveDashboard(user) {
            // Keep the existing admin rule, using the authenticated Firebase user.
            if (user.email === "muntadherkareem@gmail.com") return roleMappings.admin.dashboard;

            // Doctors have first priority in the original role mapping. Check them first
            // to avoid unnecessary reads; check remaining collections concurrently.
            const doctor = await readProfile(user, 'doctor', roleMappings.doctor);
            const doctorPage = profileDestination(doctor);
            if (doctorPage) return doctorPage;

            const roles = Object.entries(roleMappings).filter(([role]) => role !== 'doctor' && role !== 'admin');
            const results = await Promise.all(roles.map(([role, mapping]) => readProfile(user, role, mapping)));
            for (const result of results) {
                const page = profileDestination(result);
                if (page) return page;
            }
            throw accountError('account-unauthorized', 'No valid role');
        }

        async function signOutIfRequired(error) {
            if (auth && mustSignOut(error)) {
                try { await authApi.signOut(auth); }
                catch (_) { /* Never navigate on an invalid account. */ }
            }
        }

        function openDashboard(user, page) {
            if (auth.currentUser?.uid !== user.uid) throw accountError('account-changed', 'Session changed');
            if (!page || navigating) return;
            $('startupStatus').textContent = 'Opening your dashboard...';
            buttonText.textContent = 'Opening dashboard...';
            navigating = true;
            window.location.replace(page);
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();
            if (!ready || busy || navigating) return;
            if (!form.reportValidity()) return;
            showMessage('');
            setBusy(true, 'Logging in...');
            try {
                const credential = await authApi.signInWithEmailAndPassword(auth, usernameInput.value.trim(), passwordInput.value);
                buttonText.textContent = 'Verifying account...';
                const page = await timeout(resolveDashboard(credential.user));
                openDashboard(credential.user, page);
            } catch (error) {
                await signOutIfRequired(error);
                showMessage(friendlyError(error));
            } finally {
                if (!navigating) setBusy(false);
            }
        });

        forgotButton.addEventListener('click', async () => {
            if (!ready || busy || navigating) return;
            if (!usernameInput.value.trim()) {
                showMessage('Enter your account email to request a password reset.');
                usernameInput.focus();
                return;
            }
            if (!usernameInput.reportValidity()) return;
            showMessage('');
            setBusy(true, 'Sending reset link...');
            try {
                await authApi.sendPasswordResetEmail(auth, usernameInput.value.trim());
                showMessage('If an account exists for that email, you will receive a password reset link.', false);
            } catch (error) {
                if (error?.code === 'auth/user-not-found') {
                    showMessage('If an account exists for that email, you will receive a password reset link.', false);
                } else {
                    showMessage(error?.code === 'auth/too-many-requests' ? 'Too many attempts. Please try again later.' : 'Could not request a password reset. Please try again.');
                }
            } finally {
                setBusy(false);
            }
        });

        retryButton.addEventListener('click', () => window.location.reload());

        async function start() {
            const previousError = storedLoginError();
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                    apiKey: "AIzaSyDMIZubC87_z2tCnURoqQIJjCWPPdWFdnk",
                    authDomain: "pcms-e1162.firebaseapp.com",
                    projectId: "pcms-e1162",
                    storageBucket: "pcms-e1162.firebasestorage.app",
                    messagingSenderId: "383068543378",
                    appId: "1:383068543378:web:00c7d2bf95f9ded63a494b",
                    measurementId: "G-4C1P3GB6PP"
                }; 
                
                const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                // Dynamic imports ensure that a failed CDN connection does not leave
                // the startup overlay covering the form indefinitely.
                const [appApi, loadedAuth, loadedFirestore] = await timeout(Promise.all([
                    import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
                    import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
                    import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
                ]));
                authApi = loadedAuth;
                firestoreApi = loadedFirestore;
                const app = appApi.initializeApp(firebaseConfig);
                auth = authApi.getAuth(app);
                db = firestoreApi.getFirestore(app);

                if (initialAuthToken && !previousError) {
                    try { await timeout(authApi.signInWithCustomToken(auth, initialAuthToken)); }
                    catch (error) {
                        if (error?.code === 'connection-timeout') throw error;
                        // An invalid custom token does not prevent ordinary email sign-in.
                    }
                }
                await timeout(auth.authStateReady());
                ready = true;

                // The dashboards can send a login error after rejecting an account.
                // Show it rather than creating a login/dashboard redirect loop.
                if (previousError) {
                    showMessage(previousError);
                    return;
                }
                const user = auth.currentUser;
                if (!user) return;
                $('startupStatus').textContent = 'Restoring your session...';
                await timeout(authApi.reload(user));
                const page = await timeout(resolveDashboard(user));
                openDashboard(user, page);
            } catch (error) {
                await signOutIfRequired(error);
                if (!ready) {
                    showMessage('Could not initialize PSMS. Check your connection and retry.');
                    retryButton.hidden = false;
                } else {
                    showMessage(friendlyError(error));
                }
            } finally {
                if (!navigating) revealForm();
            }
        }

        // If this page is restored from the browser back/forward cache, check
        // Firebase again instead of leaving a stale disabled login button.
        window.addEventListener('pageshow', event => {
            if (event.persisted) window.location.reload();
        });

        start();
    })();
    </script>
</body>
</html>
